         signals Google (and AI answer engines reading Google's index) use to
         match this business to "сонячні панелі Закарпаття"-style queries. -->
    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "Electrician",
      "name": "Nova Energy",
      "alternateName": "Чедрик Іван",
      "url": "https://nova-energy.com.ua",
      "image": "https://nova-energy.com.ua/logo.png",
      "telephone": "+380675300103",
      "priceRange": "$$",
      "sameAs": ["https://www.tiktok.com/@novaenergy.ua"],
      "areaServed": [
        { "@type": "AdministrativeArea", "name": "Закарпатська область" },
        { "@type": "AdministrativeArea", "name": "Івано-Франківська область" },
        { "@type": "AdministrativeArea", "name": "Львівська область" }
      ],
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "Закарпатська область",
        "addressCountry": "UA"
      },
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Побудова сонячних електростанцій (СЕС)" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Акумуляторні системи та автономне живлення" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Установка сонячних панелей на дах" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Гібридні сонячні системи" } }
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "reviewCount": "6"
      },
      "review": [
        { "@type": "Review", "author": { "@type": "Person", "name": "Михайло Ковач" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" }, "reviewBody": "Замовляв у Івана будівництво гібридної СЕС на 30 кВт з інвертором Deye. Все зроблено надзвичайно акуратно, а документи по Зеленому Тарифу він оформив повністю сам, без моїх поїздок по Обленерго." },
        { "@type": "Review", "author": { "@type": "Person", "name": "Василь Степанчук" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" }, "reviewBody": "Встановили систему з акумуляторами LiFePO4 та інвертором Deye для будинку. Під час відключень світла резерв вмикається миттєво, навіть чутлива техніка не реагує." },
        { "@type": "Review", "author": { "@type": "Person", "name": "Олена & Сергій" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" }, "reviewBody": "Монтаж сонячних панелей на черепичний дах провели дуже дбайливо — жодної пошкодженої черепиці, все протестовано на герметичність." },
        { "@type": "Review", "author": { "@type": "Person", "name": "Ігор Попович" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" }, "reviewBody": "Чедрик Іван повністю переробляв електромережу та розподільний щит перед встановленням СЕС. Якість комутації, автоматика і кабельний менеджмент — просто на найвищому рівні." },
        { "@type": "Review", "author": { "@type": "Person", "name": "Юрій Маркович" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" }, "reviewBody": "Іван правильно розрахував навантаження, підібрав обладнання і встановив гібрид під ключ. Все працює стабільно та без збоїв." },
        { "@type": "Review", "author": { "@type": "Person", "name": "Андрій Габор" }, "reviewRating": { "@type": "Rating", "ratingValue": "5" }, "reviewBody": "Відмінний сервіс та повний супровід від першої консультації до виплати за Зеленим тарифом. Чедрик Іван завжди на зв'язку." }
      ]
    }
